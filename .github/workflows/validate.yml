name: Validate VitaeWorld
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Download licensed 1K surface textures
        run: npm run textures:sync
      - name: Bundle and verify 86 licensed GLBs
        run: npm run models:sync -- --strict
      - name: Build
        run: npm run build
